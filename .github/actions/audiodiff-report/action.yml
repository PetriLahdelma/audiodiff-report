name: audiodiff-report
inputs:
  before-path:
    required: true
  after-path:
    required: true
  glob:
    required: false
  thresholds:
    required: false
  upload-artifact:
    required: false
    default: "true"
  comment:
    required: false
    default: "true"
outputs:
  report-path:
    value: audiodiff
runs:
  using: composite
  steps:
    - run: npx audiodiff-report ${{ inputs.before-path }} ${{ inputs.after-path }} --glob "${{ inputs.glob }}" --format md --out ./audiodiff --fail "${{ inputs.thresholds }}"
      shell: bash
    - if: inputs.upload-artifact == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: audiodiff-report
        path: audiodiff
    - if: inputs.comment == 'true' && github.event.pull_request
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const body = fs.readFileSync('audiodiff/summary.md','utf8');
          github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            body
          });
